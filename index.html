<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f8f7">
  <meta name="description" content="우리 가족 푸꾸옥 여행 일정과 예약, 장소, 준비물을 한눈에 관리하는 여행 플래너">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="푸꾸옥 여행">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>우리 가족 푸꾸옥 여행</title>
</head>
<body>
  <div class="app-shell">
    <header id="appHeader" class="topbar"></header>
    <main id="app" class="page" tabindex="-1"></main>
    <nav id="bottomNav" class="bottom-nav" aria-label="주 메뉴"></nav>
  </div>
  <dialog id="editorDialog" class="editor-dialog" aria-label="항목 편집">
    <div id="modalContent"></div>
  </dialog>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="authGate" class="auth-gate" hidden>
    <section class="auth-card" aria-labelledby="authHeading">
      <div style="font-size:40px" aria-hidden="true">🌴</div>
      <h1 id="authHeading">우리 가족 푸꾸옥</h1>
      <p id="authNotice">부부 전용 여행 노트에 로그인해 주세요.</p>
      <form id="authForm">
        <label for="authEmail">이메일</label>
        <input id="authEmail" name="email" type="email" autocomplete="username" required placeholder="이메일 주소">
        <label for="authPassword">비밀번호</label>
        <input id="authPassword" name="password" type="password" autocomplete="current-password" required placeholder="비밀번호">
        <p id="authError" role="alert" class="auth-error" hidden></p>
        <button class="primary-button" id="authSubmit" type="submit">로그인</button>
      </form>
      <button id="authRetry" class="secondary-button" hidden type="button">다른 계정으로 로그인</button>
      <small>초대된 가족 계정만 여행 정보를 열 수 있어요.</small>
    </section>
  </div>
  <script src="data.js" defer></script>
  <script src="store.js" defer></script>
  <script src="firebase-config.js" defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
